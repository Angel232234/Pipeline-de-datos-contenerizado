services:
  # Servicio 1: Hadoop Standalone con OpenSSH
  hadoop:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: hadoop
    hostname: hadoop
    volumes:
      # Dataset montado en modo solo lectura como exige el examen
      - ./data/input:/data/input:ro
      - ./data/output:/data/output
      - ./mapreduce:/mapreduce
      - ssh_keys:/shared-ssh
    networks:
      - datamart-net
    restart: unless-stopped

  # Servicio 2: Base de Datos PostgreSQL con volumen persistente
  db:
    image: postgres:15-alpine
    container_name: db
    hostname: db
    environment:
      POSTGRES_DB: ${DB_NAME:-datamart}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Volumen nombrado para persistencia de datos
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-datamart}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datamart-net
    restart: unless-stopped

  # Servicio 3: API REST (Flask) conectada a db por nombre de servicio
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    hostname: api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-datamart}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      API_PORT: ${API_PORT:-5000}
    ports:
      - "${API_PORT:-5000}:${API_PORT:-5000}"
    volumes:
      - ./api:/app
      - ./data/output:/data/output:ro
      - ./scripts:/scripts:ro
      - ssh_keys:/shared-ssh:ro
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_started
    networks:
      - datamart-net
    restart: unless-stopped

# Red definida en el compose para comunicación interna
networks:
  datamart-net:
    name: datamart-net
    driver: bridge

# Volúmenes nombrados para persistencia y claves
volumes:
  db_data:
    name: datamart_db_data
  ssh_keys:
    name: datamart_ssh_keys 